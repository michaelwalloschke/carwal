# Cap container logs so a crash loop or verbose logger cannot fill the VPS disk.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: carwal:latest
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging
    volumes:
      # Bind mount (not a named volume) so restic on the Mac can back it up
      # over SSH file access (Story 1.5) without going through the app
      # container. Empty until Epic 4 ships CarWal.Storage's local-disk
      # adapter, which will write uploads under this same path.
      - ./media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4000/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  db:
    image: postgres:18
    env_file:
      - .env.db
    environment:
      POSTGRES_USER: carwal
      POSTGRES_DB: carwal
      # POSTGRES_PASSWORD is read from .env.db (scoped: only that var, not the
      # full .env.prod, so app secrets + family PII do not leak into the db
      # container env / `docker inspect`).
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwal -d carwal"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default_logging

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy:/etc/caddy
    environment:
      - CARWAL_DOMAIN
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
