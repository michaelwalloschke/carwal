# Cap container logs so a crash loop or verbose logger cannot fill the VPS disk.
x-logging: &default_logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  app:
    image: carwal:latest
    env_file:
      - .env.prod
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default_logging

  db:
    image: postgres:18
    env_file:
      - .env.prod
    environment:
      POSTGRES_USER: carwal
      POSTGRES_DB: carwal
      # POSTGRES_PASSWORD is read from .env.prod
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carwal -d carwal"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging: *default_logging

  caddy:
    image: caddy:2.9-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./caddy:/etc/caddy
    environment:
      - CARWAL_DOMAIN
    restart: unless-stopped
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
